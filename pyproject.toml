[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raguard-svkmsr6"
version = "0.1.0"
description = "Evaluation-first RAG pipeline: retrieval, generation, deterministic metrics, and guardrails for sensitive domains."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Souvik Misra" }]
keywords = ["rag", "llm", "evaluation", "guardrails", "hallucination", "citations"]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
sentence-transformers = ["sentence-transformers>=2.3"]
chroma = ["chromadb>=0.4"]
ragas = ["ragas>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
