name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests examples evals
          ruff format --check src tests examples evals

      - name: Type-compile check
        run: python -m compileall -q src

      - name: Test with pytest
        run: pytest -q

      - name: Offline demo smoke test
        run: python examples/mental_health_demo.py

      - name: Eval script smoke test
        run: python evals/run_eval.py
